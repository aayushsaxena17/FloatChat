# Used only by the separately opted-in owner command. No key in Compose or argv.
# Only the acquire process ever sees the key (on stdin) and the upstream network; the
# process pool and supervisor stay on the internal network without it.
services:
  live-acquire:
    extends:
      file: /home/floatchat/FloatChat-stage1/infra/docker-compose.acceptance.yml
      service: acquire
    command: [python, scripts/stage1_acceptance_runtime.py, acquire, --stdin-key]
    environment:
      FLOATCHAT_LIVE_INGESTION_ENABLED: "true"
    networks: [default, upstream]
    profiles: [live]

networks:
  upstream:
    internal: false
