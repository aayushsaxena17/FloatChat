name: Stage 0
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  stage1-components:
    name: stage1-offline-components
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.10.4', python-version: '3.12.12' }
      - name: Prepare dependency/image caches separately from acceptance
        run: |
          uv sync --all-packages --frozen
          docker build -t floatchat-stage1-postgres-offline -f infra/docker/postgres.Dockerfile .
          docker build -t floatchat-stage1-api-offline -f infra/docker/api.Dockerfile .
          docker build -t floatchat-stage1-minio-offline -f infra/docker/minio.Dockerfile .
          docker pull redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
      - name: Offline component tests (no upstream or credential)
        run: |
          sudo unshare --net -- env \
            PATH="$PATH" UV_OFFLINE=true \
            STAGE1_POSTGRES_IMAGE=floatchat-stage1-postgres-offline \
            STAGE1_API_IMAGE=floatchat-stage1-api-offline \
            STAGE1_MINIO_IMAGE=floatchat-stage1-minio-offline \
            "$PWD/.venv/bin/python" -m pytest tests/stage1 -q \
            --junitxml=reports/stage1-ci-components.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-components
          path: |
            reports/stage1-ci-components.xml
            reports/stage1-broker-evidence.json
            reports/stage1-parquet-resource.json
            reports/stage1-ingestion-example.json
            reports/stage1-ingestion-example.md
      # Component green is not the Stage 1 acceptance gate; F01/live and the
      # end-to-end 86-case matrix remain explicit implementation requirements.
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.10.4', python-version: '3.12.12' }
      - run: uv sync --all-packages --frozen
      - run: python scripts/security/install_gitleaks.py
      - run: uv run --all-packages --frozen ruff check .
      - run: uv run --all-packages --frozen ruff format --check .
      - run: uv run --all-packages --frozen mypy
      - run: uv run --all-packages --frozen python -m pytest -m 'not integration'
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m scripts.dev build
      - run: docker build --target build -f infra/docker/web.Dockerfile .
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.10.4', python-version: '3.12.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0' }
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floatchat/web exec playwright install --with-deps chromium
      - run: uv run --all-packages --frozen python -m scripts.integration
  secrets-current:
    name: secrets-current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/security/install_gitleaks.py
      - run: python scripts/security/scan.py current
  secrets-history:
    name: secrets-history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch advertised branches and tags for history coverage
        run: git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - run: python scripts/security/install_gitleaks.py
      - run: python scripts/security/scan.py history
