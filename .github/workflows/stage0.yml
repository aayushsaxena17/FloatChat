name: Stage 0
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.10.4', python-version: '3.12.12' }
      - run: uv sync --all-packages --frozen
      - run: python scripts/security/install_gitleaks.py
      - run: uv run --all-packages --frozen ruff check .
      - run: uv run --all-packages --frozen ruff format --check .
      - run: uv run --all-packages --frozen mypy
      - run: uv run --all-packages --frozen pytest -m 'not integration'
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m scripts.dev build
      - run: docker build --target build -f infra/docker/web.Dockerfile .
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.10.4', python-version: '3.12.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '10.33.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.15.0' }
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floatchat/web exec playwright install --with-deps chromium
      - run: uv run --all-packages --frozen python -m scripts.integration
  secrets-current:
    name: secrets-current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/security/install_gitleaks.py
      - run: python scripts/security/scan.py current
  secrets-history:
    name: secrets-history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch advertised branches and tags for history coverage
        run: git fetch --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - run: python scripts/security/install_gitleaks.py
      - run: python scripts/security/scan.py history
