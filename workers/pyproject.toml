[project]
name = "floatchat-workers"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "floatchat-core",
]

[project.scripts]
floatchat = "floatchat_workers.cli:main"

[tool.uv.sources]
floatchat-core = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
