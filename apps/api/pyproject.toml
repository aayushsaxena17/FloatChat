[project]
name = "floatchat-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "floatchat-core", "fastapi==0.135.1", "uvicorn==0.42.0",
  "psycopg[binary]==3.3.3", "redis==6.4.0", "boto3==1.42.70",
  "alembic==1.18.4", "sqlalchemy==2.0.48",
]

[tool.uv.sources]
floatchat-core = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
